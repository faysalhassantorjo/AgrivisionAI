<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AgriVision AI — Plant Pathology Platform{% endblock %}</title>
    
    <!-- Modern Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,500;0,600;1,500;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-serif: 'Lora', Georgia, serif;
            --font-mono: 'JetBrains Mono', monospace;

            --bg-app: #f4f6f4;
            --bg-surface: #ffffff;
            --bg-surface-elevated: #fafbfa;
            --border-color: #e2e8e2;
            --border-subtle: #edf2ed;

            --c-brand: #0f5132;
            --c-brand-hover: #0a3622;
            --c-brand-light: #e8f5ed;
            --c-brand-border: #bce3cb;
            --c-accent: #10b981;

            --c-ink: #0f172a;
            --c-ink-muted: #475569;
            --c-ink-subtle: #94a3b8;

            --status-healthy-bg: #dcfce7;
            --status-healthy-text: #15803d;
            --status-healthy-border: #86efac;

            --status-danger-bg: #fee2e2;
            --status-danger-text: #b91c1c;
            --status-danger-border: #fca5a5;

            --status-warning-bg: #fef3c7;
            --status-warning-text: #b45309;
            --status-warning-border: #fde68a;

            --shadow-subtle: 0 1px 3px rgba(0,0,0,.04);
            --shadow-card: 0 4px 16px -2px rgba(15, 23, 42, .05);
            --shadow-pop: 0 12px 32px -4px rgba(15, 23, 42, .08);
            
            --radius-window: 16px;
            --radius-card: 12px;
            --radius-btn: 10px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            font-family: var(--font-sans);
            background: var(--bg-app);
            color: var(--c-ink);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ── UNIFIED APP TOPBAR ── */
        .app-topbar {
            height: 58px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--c-ink);
        }
        .brand-logo-icon {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: linear-gradient(135deg, #10b981 0%, #0f5132 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.1rem;
            box-shadow: 0 2px 6px rgba(16, 185, 129, .25);
        }
        .brand-text {
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: -.3px;
            color: var(--c-ink);
        }
        .brand-text span {
            color: var(--c-brand);
        }
        .brand-badge {
            font-family: var(--font-mono);
            font-size: 0.62rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .08em;
            background: var(--c-brand-light);
            color: var(--c-brand);
            padding: 2px 7px;
            border-radius: 99px;
            border: 1px solid var(--c-brand-border);
        }

        /* Nav Pills inside topbar */
        .crop-nav {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg-app);
            padding: 3px;
            border-radius: 99px;
            border: 1px solid var(--border-color);
        }
        .crop-nav-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 13px;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--c-ink-muted);
            text-decoration: none;
            transition: all .2s ease;
            white-space: nowrap;
        }
        .crop-nav-item:hover {
            color: var(--c-ink);
            background: rgba(255,255,255,.6);
        }
        .crop-nav-item.active {
            background: var(--bg-surface);
            color: var(--c-brand);
            font-weight: 600;
            box-shadow: 0 1px 4px rgba(0,0,0,.06);
        }
        .crop-nav-item.beta-item {
            opacity: .85;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .engine-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 500;
            background: var(--c-brand-light);
            color: var(--c-brand);
            padding: 4px 10px;
            border-radius: 99px;
            border: 1px solid var(--c-brand-border);
        }
        .engine-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #10b981;
            animation: pulseDot 2s infinite ease-in-out;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .4; transform: scale(.9); }
        }

        /* ── CUSTOM SLIM SCROLLBAR ── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @media print {
            .app-topbar {
                display: none !important;
            }
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- Unified Application Topbar -->
    <header class="app-topbar">
        <div class="d-flex align-items-center gap-3">
            <a href="/" class="topbar-brand">
                <div class="brand-logo-icon">🌿</div>
                <div class="brand-text">Agri<span>Vision</span></div>
                <span class="brand-badge">2.0 Studio</span>
            </a>
        </div>

        <!-- Center Crop Switcher -->
        <nav class="crop-nav d-none d-md-flex">
            <a href="/" class="crop-nav-item {% if not plant_key %}active{% endif %}">
                <i class="bi bi-grid-fill"></i> All Crops
            </a>
            <a href="/hibiscus/" class="crop-nav-item {% if plant_key == 'hibiscus' %}active{% endif %}">
                <span>🌺</span> Hibiscus
            </a>
            <!--
            <a href="/zucchini/" class="crop-nav-item {% if plant_key == 'zucchini' %}active{% endif %}">
                <span>🍃</span> Zucchini
            </a>
            <a href="/tea-leaf/" class="crop-nav-item {% if plant_key == 'tea_leaf' %}active{% endif %}">
                <span>🍵</span> Tea Leaf
            </a>
            <a href="/papaya/" class="crop-nav-item beta-item {% if plant_key == 'papaya' %}active{% endif %}">
                <span>🍈</span> Papaya
            </a>
            -->
        </nav>

        <!-- Right System Indicators -->
        <div class="topbar-right">
            <div class="engine-status-pill">
                <span class="engine-dot"></span>
                <span>Neural Engine Online</span>
            </div>
            <a href="/" class="crop-nav-item d-md-none">
                <i class="bi bi-grid"></i>
            </a>
        </div>
    </header>

    <!-- Main Workspace -->
    <main>
        {% block body %}{% endblock %}
    </main>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
